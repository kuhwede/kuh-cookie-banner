name: Package GitHub release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, e.g. v1.4.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Verify release tag matches plugin version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: >-
          VERSION="$(awk '$2 == "Version:" {print $3; exit}' kc-cookie-banner/kc-cookie-banner.php)";
          TAG_VERSION="${RELEASE_TAG#v}";
          test -n "$VERSION" && test "$VERSION" = "$TAG_VERSION" &&
          echo "version=$VERSION" >> "$GITHUB_OUTPUT" &&
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Create release when manually dispatched
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target main --title "Kuh Cookie $VERSION" --generate-notes
      - name: Build and attach versioned ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: zip -qr "kc-cookie-banner-${{ steps.version.outputs.version }}.zip" kc-cookie-banner && gh release upload "${{ steps.version.outputs.tag_name }}" "kc-cookie-banner-${{ steps.version.outputs.version }}.zip" --clobber
