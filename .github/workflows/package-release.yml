name: Package GitHub release

"on":
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Build and attach versioned plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          VERSION="$(awk '$2 == "Version:" {print $3; exit}' kc-cookie-banner/kc-cookie-banner.php)";
          TAG_NAME="${{ github.event.release.tag_name || inputs.release_tag }}";
          TAG_VERSION="${TAG_NAME#v}";
          test -n "$VERSION" && test "$VERSION" = "$TAG_VERSION" &&
          zip -qr "kc-cookie-banner-${VERSION}.zip" kc-cookie-banner &&
          gh release upload "$TAG_NAME" "kc-cookie-banner-${VERSION}.zip" --clobber
