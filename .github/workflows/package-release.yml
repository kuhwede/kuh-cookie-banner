name: Package GitHub release

on:
  release:
    types: \[published\]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

```
  - name: Verify version and build plugin ZIP
    id: package
    shell: bash
    run: |
      set -euo pipefail
      VERSION="$(sed -n 's/^ \* Version: //p' kc-cookie-banner/kc-cookie-banner.php | head -n 1)"
      TAG_VERSION="${GITHUB_REF_NAME#v}"
      if [ -z "$VERSION" ] || [ "$VERSION" != "$TAG_VERSION" ]; then
        echo "Release tag (${GITHUB_REF_NAME}) does not match plugin version (${VERSION})." >&2
        exit 1
      fi
      zip -qr "kc-cookie-banner-${VERSION}.zip" kc-cookie-banner
      echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  - name: Attach ZIP to the published release
    env:
      GH_TOKEN: ${{ github.token }}
    run: gh release upload "$GITHUB_REF_NAME" "kc-cookie-banner-${{ steps.package.outputs.version }}.zip" --clobber
