name: Package GitHub release

"on":
  release:
    types: \[published\]
  workflow\_dispatch:
    inputs:
      release\_tag:
        description: Release tag to publish, e.g. v1.4.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Verify release tag matches plugin version
        id: version
        env:
          RELEASE\_TAG: ${{ github.event.release.tag\_name || inputs.release\_tag }}
        run: &gt;-
          VERSION="$(awk '$2 == "Version:" {print $3; exit}' kc-cookie-banner/kc-cookie-banner.php)";
          TAG\_VERSION="${RELEASE\_TAG#v}";
          test -n "$VERSION" &amp;&amp; test "$$VERSION" = "$$TAG\_VERSION" &amp;&amp;
          echo "version=$$VERSION" >> "$$GITHUB\_OUTPUT" &amp;&amp;
          echo "tag\_name=$$RELEASE_TAG" >> "$$GITHUB\_OUTPUT"
      - name: Create release when manually dispatched
        if: github.event\_name == 'workflow\_dispatch'
        env:
          GH\_TOKEN: ${{ github.token }}
          RELEASE\_TAG: ${{ inputs.release\_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$RELEASE\_TAG" --target main --title "Kuh Cookie $VERSION" --generate-notes
      - name: Build and attach ZIP to published release
        if: github.event\_name == 'release'
        env:
          GH\_TOKEN: ${{ github.token }}
        run: zip -qr "kc-cookie-banner-$${{ steps.version.outputs.version }}.zip" kc-cookie-banner && gh release upload "$$GITHUB\_REF\_NAME" "kc-cookie-banner-${{ steps.version.outputs.version }}.zip" --clobber